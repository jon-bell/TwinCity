name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  guarded-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Guarded-path checker self-test
        run: scripts/check-guarded-paths.py --self-test
      - name: Guarded paths (CLAUDE.md)
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: scripts/check-guarded-paths.py origin/${{ github.base_ref }} HEAD
  oracle-and-gates:
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq gcc make patch python3 bison libx11-dev libxext-dev libxpm-dev \
            xvfb x11-apps xfonts-base imagemagick >/dev/null
      - name: Core purity
        run: scripts/check-core-purity.sh
      - name: Headless oracle (build + determinism smoke)
        run: oracle/build-headless.sh && oracle/smoke-headless.sh
      - name: Oracle identity
        run: tools/oracle-identity.py
      - name: Swift golden tests
        run: swift test
      - name: Per-function differential gates vs. the C
        run: TWINCITY_ORACLE=1 swift test
      - name: Session oracle (Xvfb build + determinism smoke)
        run: oracle/build-xvfb.sh && oracle/smoke-xvfb.sh
      - name: Reference-layout oracle (-m32 full app, native i386; ledger/0001)
        run: |
          dpkg --add-architecture i386 && apt-get update -qq
          apt-get install -y -qq gcc-multilib libx11-dev:i386 libxext-dev:i386 libxpm-dev:i386 >/dev/null
          oracle/build-reference.sh && oracle/smoke-reference.sh
